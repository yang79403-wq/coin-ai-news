<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一尘交易成交雷达｜币智通 AI</title><style>body{margin:0;background:#f6f1e9;color:#292222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#420000,#780505,#b8860b);color:#fff;text-align:center;padding:28px 15px}.head h1{margin:0}.wrap{max-width:1000px;margin:auto;padding:18px}.box{background:#fff;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 4px 16px #0000000d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;background:#fff8e8;padding:14px;border-radius:12px}.stat b{display:block;color:#650000;font-size:25px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.table th{color:#650000;background:#faf5e8}.tip{font-size:12px;color:#888;line-height:1.7}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.table{min-width:720px}.scroll{overflow:auto}}</style></head><body><div class="head"><h1>🔥 一尘交易成交雷达</h1><p>币智通 AI · 公开交易信息行情研究</p></div><main class="wrap"><div class="box"><h2>📊 今日市场概览</h2><div class="grid"><div class="stat"><b id="count">--</b>记录数</div><div class="stat"><b id="done">--</b>疑似成交</div><div class="stat"><b id="avg">--</b>成交均价</div><div class="stat"><b id="time">--</b>更新时间</div></div></div><div class="box"><h2>💰 最新交易信息</h2><div class="scroll"><table class="table"><thead><tr><th>品种</th><th>报价</th><th>状态</th><th>时间</th><th>来源</th></tr></thead><tbody id="rows"><tr><td colspan="5">正在加载数据……</td></tr></tbody></table></div><p class="tip">数据仅用于市场研究。挂牌价不等于真实成交价；系统仅将帖子中出现“确认、成交、要了”等交易信号的记录标记为疑似成交，最终以原帖实际交易结果为准。</p></div><div class="box"><h2>⚠️ 数据说明</h2><p class="tip">本页面只展示公开可访问交易信息，不绕过登录、验证码或访问控制。若目标网站限制自动访问，系统不会规避限制。后续可在获得合适的数据接口或授权后接入更完整的实时成交数据库。</p></div><div class="box"><a href="index.html" style="color:#650000;font-weight:800">← 返回币智通 AI 首页</a></div></main><script>fetch('yichen_data.json?'+Date.now()).then(r=>r.json()).then(d=>{let a=Array.isArray(d)?d:(d.records||[]);document.getElementById('count').textContent=a.length;let done=a.filter(x=>/成交|确认|要了/.test((x.status||x.title||''))&&!/不成交|取消|撤/.test((x.status||x.title||'')));document.getElementById('done').textContent=done.length;let prices=a.map(x=>Number(String(x.price||'').replace(/[^0-9.]/g,''))).filter(x=>x>0);document.getElementById('avg').textContent=prices.length?'¥'+(prices.reduce((s,x)=>s+x,0)/prices.length).toFixed(0):'--';document.getElementById('time').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});document.getElementById('rows').innerHTML=a.slice(0,50).map(x=>`<tr><td>${x.name||x.title||'未识别'}</td><td>${x.price?'¥'+x.price:'--'}</td><td>${x.status||'待确认'}</td><td>${x.time||x.date||'--'}</td><td>${x.url?`<a href="${x.url}" target="_blank" style="color:#650000">原帖</a>`:'公开信息'}</td></tr>`).join('')||'<tr><td colspan="5">暂无数据</td></tr>'}).catch(()=>{document.getElementById('rows').innerHTML='<tr><td colspan="5">当前暂无可用数据，采集任务下一次运行会自动更新。</td></tr>'});</script></body></html>
