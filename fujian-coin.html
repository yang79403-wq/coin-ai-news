<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福建钱币资料库｜洪盛集藏</title><link rel="stylesheet" href="style.css"><style>.records{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.record{background:#fff;border:1px solid #dfcba8;border-radius:16px;padding:18px}.record h3{color:#700805;margin:0 0 8px}.record p{font-size:13px;line-height:1.8;color:#75695f}.record a{color:#7a4300;font-weight:700}@media(max-width:700px){.records{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="wrap"><div class="eyebrow">FUJIAN NUMISMATIC RESEARCH</div><h1>福建钱币</h1><p>实物图鉴 · 历史资料 · 版别研究</p><div class="notice">本专题为公益研究资料库，只做福建钱币资料收集、实物图片资料整理、历史分析与学习交流，不提供交易报价。</div></div></header><main class="wrap"><section class="panel"><h2>🇨🇳 福建钱币资料库</h2><p class="muted">机器人每日整理公开文化机构、博物馆、地方志等资料，逐步建立福建钱币数字档案。图片优先采用明确开放授权资料；授权不明确时仅提供来源页。</p><div class="records" id="records">加载中……</div></section></main><footer><div class="wrap">洪盛集藏｜公益学习交流研究平台</div></footer><script>const esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]));fetch('data/fujian-coins.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('records').innerHTML=(d.records||[]).map(x=>`<article class="record"><h3>${esc(x.name)}</h3><p><b>分类：</b>${esc(x.category)}<br><b>时期：</b>${esc(x.period)}<br><b>面额：</b>${esc(x.denomination)}</p><p>${esc(x.features)}</p><p><b>资料来源：</b>${esc(x.source)}<br><a href="${esc(x.source_url)}" target="_blank" rel="noopener">查看原始资料与实物图片</a></p><p>${esc(x.image_status)}</p></article>`).join('')||'暂无资料'})</script></body></html>
