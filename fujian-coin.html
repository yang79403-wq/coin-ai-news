<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福建钱币资料库｜洪盛集藏</title><style>body{margin:0;background:#f7f1e7;color:#2b211b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.hero{background:#190000;color:#f3d37b;padding:28px 16px}.box{background:#fffdf8;border:1px solid #ddcba9;border-radius:18px;padding:20px;margin-top:16px}.title{color:#780b08;font-family:serif}.muted{color:#75695f;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #ddcba9;border-radius:15px;padding:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="wrap"><a href="./" style="color:#f3d37b">← 首页</a><h1>🇨🇳 福建钱币资料库</h1><p>只做资料收集、实物图鉴、历史整理与分析研究，不做成交和求购价格。</p></div></header><main class="wrap"><div class="box"><h2 class="title">资料分类</h2><div class="grid"><div class="card"><h3>福建铜元</h3><p>福建官局造、闽关铜元及民国地方机制铜币。</p></div><div class="card"><h3>福建银元 / 银角</h3><p>福建官局造、福建省造及地方银质辅币资料。</p></div><div class="card"><h3>福建纸币</h3><p>福建银行、福建省银行及地方纸币。</p></div><div class="card"><h3>地方货币</h3><p>特殊历史时期福建地方货币资料。</p></div><div class="card"><h3>铸币历史</h3><p>造币机构、年代、铸造品种与历史文献。</p></div><div class="card"><h3>实物图鉴</h3><p>开放授权、自有或获授权实物图片及来源说明。</p></div></div></div><div class="box"><h2 class="title">自动资料整理</h2><p class="muted">机器人按计划更新公开资料索引。授权不明确的第三方图片不直接镜像，只保留来源链接。</p><div id="out" class="muted">读取资料中……</div></div></main><script>fetch('./data/fujian-coins.json?'+Date.now()).then(r=>r.json()).then(d=>{let a=d.records||[];out.innerHTML='<b>当前资料条目：</b>'+a.length+' 条<br>'+a.map(x=>x.name+'｜'+x.category).join('<br>')}).catch(()=>out.innerHTML='资料暂时无法读取。');</script></body></html>
