<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福建钱币资料库｜洪盛集藏</title><style>body{margin:0;background:#f7f1e7;color:#30251e;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px 16px}.hero{background:#260400;color:#fff;padding:30px 0}.hero h1{color:#f1d27b;font-family:serif;font-size:38px}.notice{background:#fff5d7;border:1px solid #ddc68d;padding:14px;border-radius:12px;color:#68563c;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.card{background:#fff;border:1px solid #dfcba8;border-radius:15px;padding:17px}.card h2{color:#780b06;font-size:20px}.card p{font-size:13px;line-height:1.8;color:#71665b}.card a{color:#780b06;font-weight:bold}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="wrap"><a href="./" style="color:#f1d27b">← 洪盛集藏首页</a><h1>🇨🇳 福建钱币资料库</h1><p>实物图鉴 · 历史资料 · 版别研究</p><div class="notice">本专题只做福建钱币资料收集、实物图片资料整理、历史分析与学习交流，不提供交易报价。</div></div></header><main class="wrap"><div id="list">加载中……</div></main><script>const e=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]));fetch('data/fujian-coins.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('list').innerHTML='<p>最近更新：'+e(d.updated||'')+'</p><div class="grid">'+(d.records||[]).map(x=>'<article class="card"><h2>'+e(x.name)+'</h2><p><b>分类：</b>'+e(x.category||'')+'<br><b>时期：</b>'+e(x.period||'')+'<br><b>面额：</b>'+e(x.denomination||'')+'</p><p>'+e(x.features||'')+'</p><p><b>资料来源：</b>'+e(x.source||'')+'<br><a href="'+e(x.source_url||'#')+'" target="_blank" rel="noopener">查看原始资料与实物图片</a></p><p>'+e(x.image_status||'')+'</p></article>').join('')+'</div>'})</script></body></html>
