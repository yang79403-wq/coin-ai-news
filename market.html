<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日成交/求购｜洪盛集藏</title><style>body{margin:0;background:#f7f1e7;color:#2b211b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.hero{background:#190000;color:#f3d37b;padding:28px 16px}.box{background:#fffdf8;border:1px solid #ddcba9;border-radius:18px;padding:20px;margin-top:18px}.title{color:#780b08;font-family:serif;font-size:30px}.muted{color:#81756b;line-height:1.8}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eadfcf}th{color:#780b08}</style></head><body><header class="hero"><div class="wrap"><a href="./" style="color:#f3d37b">← 洪盛集藏首页</a><h1>📊 今日成交 / 求购价格表</h1><div>公开资料整理 · 学习交流参考</div></div></header><main class="wrap"><div class="box"><div class="muted">成交与求购严格分开。只有能够核验来源的记录才进入价格表；暂无数据时明确显示暂无经核验记录。</div><div id="out" class="muted" style="margin-top:18px">读取中……</div></div></main><script>fetch('./data/market.json?'+Date.now()).then(r=>r.json()).then(d=>{let rows=d.rows||[];if(!rows.length){out.innerHTML='<b>暂无经核验的今日成交/求购记录。</b>'}else{out.innerHTML='<table><thead><tr><th>分类</th><th>品种</th><th>状态</th><th>价格</th><th>日期</th><th>来源</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+e(x.category)+'</td><td>'+e(x.name)+'</td><td>'+e(x.status)+'</td><td>'+e(x.price)+'</td><td>'+e(x.date)+'</td><td>'+e(x.source)+'</td></tr>').join('')+'</tbody></table>'}}).catch(()=>out.innerHTML='价格数据暂时无法读取。');function e(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</script></body></html>
