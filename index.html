<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>洪盛集藏｜钱币收藏公益资料平台</title>
<meta name="description" content="洪盛集藏，公益钱币收藏资料交流平台。">
<style>
:root{--red:#650b08;--gold:#c9a55b;--paper:#f7f1e7;--ink:#28211c;--muted:#756b61}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.hero{padding:70px 20px;background:linear-gradient(135deg,#190000,#650b08);color:#fff;text-align:center}.brand{font-family:serif;font-size:52px;color:#efd38b}.hero p{max-width:720px;margin:18px auto;line-height:1.9;color:#eadfcf}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.search{display:flex;gap:10px;margin:-5px auto 28px;max-width:760px}.search input{flex:1;padding:15px;border:1px solid #d8c7aa;border-radius:12px;font-size:16px}.search button{background:var(--red);color:#fff;border:0;border-radius:12px;padding:0 22px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{display:block;padding:24px;background:#fffdf8;border:1px solid #e0cfb2;border-radius:18px;text-decoration:none;color:inherit}.card h2{margin:0;color:var(--red);font-family:serif}.card p{color:var(--muted);line-height:1.7;font-size:14px}footer{text-align:center;padding:35px;color:#8a7e70;font-size:12px;line-height:1.8}@media(max-width:700px){.grid{grid-template-columns:1fr}.brand{font-size:42px}}
</style>
</head>
<body>
<header class="hero"><div class="brand">洪盛集藏</div><p>钱币收藏公益资料交流平台<br>以公开资料整理、收藏知识、实物图鉴与历史研究为核心。</p></header>
<main class="wrap">
<div class="search"><input placeholder="搜索钱币、版别、年代、历史资料"><button>搜索</button></div>
<div class="grid">
<a class="card" href="#market"><h2>📊 今日成交 / 求购</h2><p>只展示经过来源核验的公开行情资料。暂无核验数据时不显示虚假价格。</p></a>
<a class="card" href="#fujian"><h2>🇨🇳 福建钱币资料库</h2><p>福建铜元、银元、银角、纸币、地方货币及铸币历史资料与实物图鉴。</p></a>
<a class="card" href="#knowledge"><h2>📚 钱币知识</h2><p>钱币历史、版别研究、收藏知识与学习资料。</p></a>
</div>
</main>
<footer>洪盛集藏｜公益学习、收藏研究与交流平台<br>资料仅供学习交流参考，不收取任何费用。</footer>
</body>
</html>
