<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回收价格参考表｜洪盛集藏</title><style>body{margin:0;background:#f8f0df;color:#2b211a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 16px}.hero{background:#220805;color:#f4d47b;padding:28px 0}.hero h1{margin:0 0 8px;font-family:KaiTi,serif}.hero p{color:#eadcc5;line-height:1.7}.panel{margin:22px 0;background:#fff;border:1px solid #dfc89c;border-radius:16px;overflow:auto}.head{background:#7b0d08;color:#f4d47b;padding:13px 16px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px;border-bottom:1px solid #eadfca;font-size:12px;text-align:left}.table th{background:#f5e8ca}.price{font-weight:900;color:#7b0d08}.notice{background:#fff2c9;border:1px solid #e0bf67;padding:14px;border-radius:12px;font-size:12px;line-height:1.8}.empty{text-align:center;padding:35px;color:#75695c}a{color:#765012;font-weight:800}</style></head><body><header class="hero"><div class="wrap"><h1>💰 回收价格参考表</h1><p>洪盛集藏自动整理公开来源中明确标注的“回收价 / 收购价”。本页面是资料参考，不是洪盛集藏自身报价。</p></div></header><main class="wrap"><div class="notice">价格会因年份、版别、品相、号码、数量、包装及市场变化产生明显差异。本站不编造没有来源依据的价格；每条记录保留原始来源。<br>数据来源：一尘网等公开页面。部分页面可能因网络或访问限制暂时无法采集。</div><div class="panel"><div class="head">今日公开回收报价</div><div id="app"><div class="empty">加载中……</div></div></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('data/recovery-prices.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{let a=d.records||[];if(!a.length){app.innerHTML='<div class="empty">当前暂无经过核验的公开回收报价，机器人会继续自动检查。</div>';return}app.innerHTML='<table class="table"><tr><th>品种</th><th>回收价格</th><th>来源</th><th>日期</th><th>核验</th></tr>'+a.map(x=>`<tr><td>${esc(x.name)}</td><td class="price">${esc(x.price)}</td><td><a href="${esc(x.source_url)}" target="_blank">${esc(x.source)}</a></td><td>${esc(x.date)}</td><td>${esc(x.verification)}</td></tr>`).join('')+'</table>'}).catch(()=>app.innerHTML='<div class="empty">数据暂时无法加载。</div>')</script></body></html>
