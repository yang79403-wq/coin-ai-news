<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜索｜洪盛集藏</title><body style="font-family:sans-serif;background:#f7f1e7;padding:30px"><a href="./">← 首页</a><h1>🔍 钱币搜索中心</h1><input id="q" style="padding:12px;width:70%" placeholder="输入钱币名称"><button onclick="s()">搜索</button><div id="o" style="margin-top:20px"></div><script>let q=new URLSearchParams(location.search).get('q')||'';document.getElementById('q').value=q;function s(){location.href='search.html?q='+encodeURIComponent(document.getElementById('q').value)}async function load(){let d=await fetch('data/fujian-coins.json').then(r=>r.json());let a=d.records||[];let x=q.toLowerCase();let m=a.filter(i=>Object.values(i).join(' ').toLowerCase().includes(x));document.getElementById('o').innerHTML=x?(m.length?m.map(i=>'<p><b>'+i.name+'</b>｜'+i.category+'</p>').join(''):'暂无匹配资料'):'请输入关键词'}load()</script></body></html>
