name: 币智通AI每日资讯

on:
  schedule:
    # GitHub Actions 使用 UTC；01:00 UTC = 北京时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: 获取网站代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装公开资讯采集依赖
        run: pip install feedparser requests

      - name: AI每日资讯与头条数据
        run: python news_v2.py

      - name: 一尘与闲鱼公开网页接入检查
        run: python market_update.py

      - name: 自动提交每日数据
        run: |
          git config --global user.name "币智通AI"
          git config --global user.email "actions@github.com"
          git add news-data.json news.html market-data.json news_v2.py market_update.py index.html .github/workflows/daily.yml
          git diff --cached --quiet || git commit -m "AI每日更新钱币资讯与公开行情数据"
          git push
