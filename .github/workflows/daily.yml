name: 币智通AI每日资讯

on:
  push:
    paths-ignore:
      - 'assets/coins/**'
  schedule:
    # GitHub Actions 使用 UTC；每4小时运行一次，约北京时间 01/05/09/13/17/21 点
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: 获取网站代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装公开资讯采集依赖
        run: pip install feedparser requests Pillow beautifulsoup4

      - name: 镜像真实钱币图片到本站
        run: python mirror_coin_images.py

      - name: 补充首页真实钱币图鉴图片
        run: python mirror_real_gallery_images.py

      - name: 修复首页钱币图片路径
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'assets/coins/rare-xianfeng.jpg': 'assets/coins/cash-coins-a.jpg',
              'assets/coins/yuan-silver.jpg': 'assets/coins/yuan-3-obverse.jpg',
              'assets/coins/ancient.jpg': 'assets/coins/cash-coins-a.jpg',
              'assets/coins/banknote.jpg': 'assets/coins/rmb1-100-1b.jpg',
              'assets/coins/commemorative.jpg': 'assets/coins/founding-commemorative.jpg',
              'assets/coins/gold-silver.jpg': 'assets/coins/panda-2016-reverse.png',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print('首页钱币图片路径已修复')
          PY

      - name: 修正城市服务与鉴定免责声明
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('福建泉州 · 厦门 · 福州 ·成都 当天评估鉴定', '泉州 · 厦门 · 福州 · 成都 当天评估鉴定')
          s = s.replace('泉州、厦门、福州及福建省内地区，可提前预约安排<strong>当天上门评估、鉴定、价格分析</strong>。', '泉州、厦门、福州及福建省内地区，可提前预约安排<strong>当天上门评估、鉴定、价格分析</strong>；成都可提前预约当地面对面服务。')
          if '成都 Chengdu' not in s:
              needle = '<div class="city-card"><b>福州 Fuzhou</b><strong>✓ 当天可预约</strong><span>鉴定 · 估价 · 市场分析</span></div>'
              add = needle + '<div class="city-card"><b>成都 Chengdu</b><strong>✓ 可预约服务</strong><span>鉴定 · 估价 · 市场分析</span></div>'
              s = s.replace(needle, add, 1)
          exact = 'AI鉴定结果仅作为收藏研究和价格参考，不作为法律意义上的鉴定结论。'
          if exact not in s:
              anchor = '<div class="notice">AI分析和价格仅作收藏研究参考，不替代实物专业鉴定，也不保证成交价格。</div>'
              replacement = anchor + '<div class="notice">⚠️ ' + exact + '</div>'
              s = s.replace(anchor, replacement, 1)
          p.write_text(s, encoding='utf-8')
          print('城市服务与AI鉴定免责声明已修正')
          PY

      - name: 注入真实钱币实物图鉴
        run: python inject_real_coin_gallery.py

      - name: AI每日资讯与头条数据
        run: python news_v2.py

      - name: 生成每日收藏品趣闻
        run: python collectible_facts.py

      - name: 采集指定公开钱币市场数据
        run: python market_update.py

      - name: 注入成交价格图片点击查看功能
        run: python inject_market_images_v2.py

      - name: 检查关键网页资源
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          required = ['index.html', 'ai_appraisal.html', 'market-data.json', 'news-data.json']
          missing = [x for x in required if not (root / x).exists()]
          if missing:
              raise SystemExit('缺少关键文件: ' + ', '.join(missing))
          bad = sorted(set(re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']', html)))
          bad = [x for x in bad if x.startswith('assets/') and not (root / x.split('?',1)[0]).exists()]
          if bad:
              raise SystemExit('发现不存在的本地资源: ' + ', '.join(bad[:20]))
          print('关键网页资源检查通过')
          PY

      - name: 自动提交每日数据与本地图片
        run: |
          git config --global user.name "币智通AI"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "AI自动更新钱币资讯行情与真实钱币图鉴"
          git push
