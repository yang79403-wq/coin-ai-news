name: 币智通AI每日资讯

on:
  schedule:
    # GitHub Actions 使用 UTC；01:00 UTC = 北京时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: 获取网站代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install feedparser

      - name: 自动采集并生成网站
        run: python news.py

      - name: 注入服务内容与价格表
        run: python services.py

      - name: 添加中英文模式与联系地址
        run: python i18n.py

      - name: 自动提交更新
        run: |
          git config --global user.name "币智通AI"
          git config --global user.email "actions@github.com"
          git add index.html news.py services.py i18n.py .github/workflows/daily.yml
          git diff --cached --quiet || git commit -m "升级中英文模式与联系地址"
          git push
