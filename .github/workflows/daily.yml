name: 币智通AI每日资讯

on:
  push:
    paths-ignore:
      - 'assets/coins/**'
  schedule:
    # GitHub Actions 使用 UTC；01:00 UTC = 北京时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: 获取网站代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装公开资讯采集依赖
        run: pip install feedparser requests Pillow beautifulsoup4

      - name: 镜像真实钱币图片到本站
        run: python mirror_coin_images.py

      - name: AI每日资讯与头条数据
        run: python news_v2.py

      - name: 生成每日收藏品趣闻
        run: python collectible_facts.py

      - name: 采集指定公开钱币市场数据
        run: python market_update.py

      - name: 注入成交价格图片点击查看功能
        run: python inject_market_images.py

      - name: 自动提交每日数据与本地图片
        run: |
          git config --global user.name "币智通AI"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "AI每日更新钱币资讯行情与收藏品趣闻"
          git push
