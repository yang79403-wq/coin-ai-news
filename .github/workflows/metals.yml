name: 更新黄金白银行情
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 更新贵金属数据
        run: python update_metals.py
      - name: 提交更新
        run: |
          git config user.name 'coinai-bot'
          git config user.email 'actions@github.com'
          git add metals.json
          git diff --cached --quiet || git commit -m 'auto: update gold silver prices'
          git push
