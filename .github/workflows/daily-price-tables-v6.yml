name: 洪盛集藏网每日钱币成交求购价格表 V6 全版块采集

on:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '37 12 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '17 16 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '37 20 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-ai-price-tables-v6
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: V6 full-board collector
        run: python market_update_v6.py

      - name: Validate generated price tables
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('price-tables.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d.get('version') == 'V6'
          assert isinstance(d.get('rows'), list)
          assert isinstance(d.get('tables'), dict)
          for r in d['rows']:
              assert r.get('source_url')
              assert r.get('item_url')
              assert r.get('price') is not None
              assert r.get('state') in ('成交', '求购')
          print('rows:', len(d['rows']))
          print('categories:', sorted(d['tables']))
          print('status:', d.get('status'))
          PY

      - name: Publish V6 price data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name '洪盛集藏网'
          git config user.email 'actions@github.com'
          git add price-tables.json
          if git diff --cached --quiet; then
            echo 'No V6 price-table changes.'
            exit 0
          fi
          git commit -m 'data: update V6 full-board coin price tables'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Published on attempt $attempt"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          exit 1
