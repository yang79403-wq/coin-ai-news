name: 洪盛集藏网视觉升级

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 获取网站代码
        uses: actions/checkout@v4

      - name: 执行古韵视觉升级并清理前台AI对话
        run: python visual_refresh.py

      - name: 注入福建钱币特色版块与中国网站资料索引
        run: python inject_fujian_home.py

      - name: 检查HTML基础结构
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['<html','<head>','</head>','<body>','</body>','洪盛集藏网','hongsheng-heritage-theme','HONGSHENG_FUJIAN_SECTION_V1','HONGSHENG_FUJIAN_CHINA_SOURCES_V1']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('HTML检查失败: '+', '.join(missing))
          if 'coin-ai-search-css' in s or 'COIN_AI_SEARCH_V1' in s or 'coin-ai-chat-script' in s:
              raise SystemExit('前台AI对话模块仍存在，停止发布')
          print('HTML检查通过')
          PY

      - name: 提交视觉升级
        run: |
          git config user.name 'hongsheng-collection-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html visual_refresh.py inject_fujian_home.py fujian.html data/fujian-coins.json data/fujian-china-sources.json
          if git diff --cached --quiet; then
            echo '无需更新'
            exit 0
          fi
          git commit -m 'style: add Fujian China-source index [skip ci]'
          git push
