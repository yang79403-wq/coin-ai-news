name: 洪盛集藏福建钱币资料自动整理

on:
  schedule:
    - cron: '35 1 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '35 13 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
  push:
    paths:
      - 'fujian_archive_collect.py'
      - 'data/fujian-coins.json'
      - '.github/workflows/fujian-archive.yml'

permissions:
  contents: write

concurrency:
  group: fujian-archive-main
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装资料采集依赖
        run: pip install requests beautifulsoup4
      - name: 自动采集福建钱币资料与授权图片
        run: python fujian_archive_collect.py
      - name: 检查福建资料库
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/fujian-coins.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('records'), '福建资料库没有记录'
          assert '福建成交行情' not in d.get('categories', []), '福建资料库不得混入成交行情'
          print('records=',len(d['records']))
          print('categories=',d['categories'])
          PY
      - name: 提交福建资料更新
        run: |
          git config user.name '洪盛集藏网'
          git config user.email 'actions@github.com'
          git add data/fujian-coins.json assets/fujian
          git diff --cached --quiet || git commit -m '每日更新：福建钱币资料与授权图片'
          git pull --rebase --autostash origin main
          git push origin main
