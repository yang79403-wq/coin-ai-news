name: 洪盛集藏网每日钱币成交求购价格表 V5

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 8 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '30 12 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '30 16 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '30 20 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-ai-price-tables
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect public transaction and wanted-price pages
        run: python market_update_v5.py

      - name: Validate generated price tables
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('price-tables.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          rows=d.get('rows', [])
          for r in rows:
              if not r.get('source_url') or not r.get('item_url') or r.get('price') is None:
                  raise SystemExit('invalid generated row')
          print('price-table rows:', len(rows))
          print('categories:', ', '.join(sorted(d.get('tables', {}).keys())))
          print('status:', d.get('status'))
          PY

      - name: Publish price-table data safely
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name '洪盛集藏网'
          git config user.email 'actions@github.com'
          git add price-tables.json
          if git diff --cached --quiet; then
            echo 'No price-table changes.'
            exit 0
          fi
          git commit -m 'data: update daily coin transaction and wanted price tables'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Published on attempt $attempt"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          exit 1
