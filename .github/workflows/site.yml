name: 洪盛集藏｜自动采集与网站发布

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
    - cron: '30 7 * * *'
    - cron: '30 13 * * *'
    - cron: '30 19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hongsheng-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Collect fresh data
        run: python collector.py
      - name: Validate site
        run: |
          python -m py_compile collector.py
          python - <<'PY'
          import json
          from pathlib import Path
          for f in ('data/market.json','data/fujian.json'):
              d=json.loads(Path(f).read_text(encoding='utf-8'))
              assert isinstance(d.get('records'),list), f'{f}: records must be list'
              print(f, 'records=',len(d['records']), 'updated=',d.get('updated_at'))
          assert Path('index.html').exists(), 'index.html missing'
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
