name: 洪盛集藏｜每日自动采集并部署网站

on:
  schedule:
    - cron: '20 8 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '20 14 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '20 20 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hongsheng-site
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install requests beautifulsoup4

      - name: Run daily collector
        run: python daily_bot.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in ['data/market.json','data/fujian.json']:
              d=json.loads(Path(p).read_text(encoding='utf-8'))
              assert 'records' in d, p
              print(p, 'records=', len(d['records']))
          PY

      - name: Save generated data to repository
        run: |
          git config user.name '洪盛集藏自动机器人'
          git config user.email 'actions@github.com'
          git add data/market.json data/fujian.json
          if git diff --cached --quiet; then
            echo '没有新的数据变化'
          else
            git commit -m 'data: 自动更新钱币资料与行情'
            git push origin main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
