name: 洪盛集藏｜每日自动采集并部署

on:
  schedule:
    - cron: '20 8 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '20 14 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '20 20 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hongsheng-site
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Run collector
        run: python collector.py

      - name: Validate data files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('market','fujian'):
              p=Path('data')/(name+'.json')
              d=json.loads(p.read_text(encoding='utf-8'))
              assert isinstance(d.get('records'), list), name
              print(name, 'records=', len(d['records']))
          PY

      - name: Persist generated data without triggering another collection
        run: |
          git config user.name '洪盛集藏自动机器人'
          git config user.email 'actions@github.com'
          git add data/market.json data/fujian.json
          if git diff --cached --quiet; then
            echo '数据没有变化'
          else
            git commit -m 'data: 每日自动更新钱币资料与行情 [skip ci]'
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
