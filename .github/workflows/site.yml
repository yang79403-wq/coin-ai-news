name: 洪盛集藏｜每日唯一自动更新

on:
  schedule:
    - cron: '23 1 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '23 7 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '23 13 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hongsheng-site
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install requests beautifulsoup4
      - name: 运行唯一数据采集器
        run: python collector.py
      - name: 验证网站数据
        run: |
          python -m py_compile collector.py
          python - <<'PY'
          import json
          from pathlib import Path
          for p in ['data/price-tables.json','data/fujian-coins.json']:
              d=json.loads(Path(p).read_text(encoding='utf-8'))
              print(p, 'OK')
          PY
      - name: 保存每日数据
        run: |
          git config user.name '洪盛集藏网'
          git config user.email 'actions@github.com'
          git add data/price-tables.json data/fujian-coins.json
          git diff --cached --quiet || git commit -m 'data: daily automatic update [skip ci]'
          git push origin main || true
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 构建 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
