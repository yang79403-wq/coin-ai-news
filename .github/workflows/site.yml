name: 洪盛集藏｜唯一主工作流

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '17 5 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '17 9 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '17 13 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hongsheng-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install requests beautifulsoup4

      - name: Collect verified public market records
        run: |
          if [ -f market_collect.py ]; then python market_collect.py || true; fi

      - name: Validate site data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/price-tables.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert 'tables' in d
          print('market tables:', len(d['tables']))
          f=Path('data/fujian-coins.json')
          if f.exists():
              fd=json.loads(f.read_text(encoding='utf-8'))
              assert fd.get('records') is not None
              print('fujian records:', len(fd['records']))
          PY

      - name: Commit generated data when changed
        run: |
          git config user.name '洪盛集藏网'
          git config user.email 'actions@github.com'
          git add data/price-tables.json data/fujian-coins.json assets/fujian || true
          if ! git diff --cached --quiet; then
            git commit -m 'data: daily verified market and Fujian archive update [skip ci]'
            git push origin main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
