name: 币智通AI智能搜索注入

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-search:
    runs-on: ubuntu-latest
    steps:
      - name: 获取网站代码
        uses: actions/checkout@v4

      - name: 自动修复AI搜索注入器
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('inject_ai_search_v2.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("re.sub(pattern, html.rstrip(), s, count=1, flags=re.S)", "re.sub(pattern, lambda _m: html.rstrip(), s, count=1, flags=re.S)")
          s = s.replace("re.sub(css_pattern, css.strip(), s, count=1, flags=re.S)", "re.sub(css_pattern, lambda _m: css.strip(), s, count=1, flags=re.S)")
          p.write_text(s, encoding='utf-8')
          print('inject_ai_search_v2.py auto-fixed')
          PY

      - name: 检查并注入AI搜索
        run: python inject_ai_search_v2.py

      - name: 提交搜索页面修改
        run: |
          if git diff --quiet; then
            echo "AI search already injected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html inject_ai_search_v2.py
          git commit -m "Fix and upgrade CoinAI GPT-style search"
          git push
