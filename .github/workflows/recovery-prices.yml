name: 洪盛集藏回收价格表自动整理

on:
  schedule:
    - cron: '50 1 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '50 7 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '50 13 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '50 17 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recovery-prices-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: 采集公开回收报价
        run: python recovery_price_collect.py
      - name: 验证数据结构
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/recovery-prices.json',encoding='utf-8'))
          assert 'records' in d and 'sources' in d
          for x in d['records']:
              assert x.get('type') == '回收报价'
              assert x.get('source_url')
          print('recovery records=',len(d['records']))
          PY
      - name: 提交更新
        run: |
          git config user.name '洪盛集藏网'
          git config user.email 'actions@github.com'
          git add data/recovery-prices.json
          git diff --cached --quiet || git commit -m '每日更新：一尘网回收价格表'
          git push origin main
