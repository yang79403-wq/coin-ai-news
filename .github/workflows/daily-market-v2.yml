name: 洪盛集藏网每日成交行情 V2

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hongsheng-daily-market-main
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect source-linked transactions
        run: python market_update.py

      - name: Verify original item pages
        run: python verify_market_data.py

      - name: Update sitemap lastmod
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import date
          p=Path('sitemap.xml')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<lastmod>[^<]+</lastmod>', f'<lastmod>{date.today().isoformat()}</lastmod>', s, count=1)
          p.write_text(s, encoding='utf-8')
          print('sitemap lastmod:', date.today().isoformat())
          PY

      - name: Validate verified data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('market-data.json').read_text(encoding='utf-8'))
          rows=d.get('rows', [])
          bad=[r for r in rows if not r.get('item_url') or not r.get('image_url') or r.get('price') is None or not r.get('transaction_confirmed')]
          if bad:
              raise SystemExit(f'invalid rows: {len(bad)}')
          print('verified rows:', len(rows))
          for s in d.get('status',[]):
              print(s.get('source_name'), 'pages=', s.get('pages'), 'rows=', s.get('rows'), 'ok=', s.get('ok'))
          PY

      - name: Safely publish generated files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hongsheng-generated
          cp market-data.json /tmp/hongsheng-generated/market-data.json
          cp index.html /tmp/hongsheng-generated/index.html
          cp sitemap.xml /tmp/hongsheng-generated/sitemap.xml

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/hongsheng-generated/market-data.json market-data.json
            cp /tmp/hongsheng-generated/index.html index.html
            cp /tmp/hongsheng-generated/sitemap.xml sitemap.xml
            git config user.name '洪盛集藏网'
            git config user.email 'actions@github.com'
            git add market-data.json index.html sitemap.xml
            if git diff --cached --quiet; then
              echo 'No generated changes to publish.'
              exit 0
            fi
            git commit -m 'data: publish verified coin transaction prices'
            if git push origin HEAD:main; then
              echo 'Publish succeeded on attempt' "$attempt"
              exit 0
            fi
            echo 'Push conflicted; retrying with latest main.'
            sleep 3
          done
          echo 'Unable to publish after 3 attempts.'
          exit 1
