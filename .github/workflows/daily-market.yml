name: 洪盛集藏网每日成交行情 V4

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hongsheng-daily-market-main
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect and verify V4 transactions
        run: python market_update_v4.py

      - name: Validate strict source-linked output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('market-data.json').read_text(encoding='utf-8'))
          rows=d.get('rows',[])
          for r in rows:
              assert r.get('item_url'), 'missing item_url'
              assert r.get('image_url'), 'missing image_url'
              assert r.get('transaction_confirmed') is True, 'not confirmed'
              assert r.get('price') is not None and float(r['price']) > 0, 'missing price'
          print('STRICT VERIFIED ROWS:', len(rows))
          for s in d.get('status',[]):
              print(s.get('source_name'), 'pages=', s.get('pages'), 'candidate=', s.get('candidate_detail_pages'), 'rows=', s.get('rows'), 'proxy=', s.get('proxy_used'))
              if s.get('errors'): print(' errors=', s.get('errors'))
          PY

      - name: Update sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import date
          p=Path('sitemap.xml')
          text=p.read_text(encoding='utf-8') if p.exists() else '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n</urlset>\n'
          today=date.today().isoformat()
          import re
          text=re.sub(r'<lastmod>[^<]+</lastmod>', f'<lastmod>{today}</lastmod>', text)
          if '<lastmod>' not in text:
              text=text.replace('</loc>', f'</loc><lastmod>{today}</lastmod>', 1)
          p.write_text(text, encoding='utf-8')
          print('sitemap updated:', today)
          PY

      - name: Commit daily data and sitemap
        run: |
          git config user.name '洪盛集藏网'
          git config user.email 'actions@github.com'
          git add market-data.json sitemap.xml index.html
          git diff --cached --quiet || git commit -m 'data: update V4 verified coin transaction prices'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; git add market-data.json sitemap.xml index.html; git diff --cached --quiet || git commit -m 'data: update V4 verified coin transaction prices'; }
            if git push origin main; then echo 'Publish succeeded on attempt' $i; exit 0; fi
            sleep 3
          done
          exit 1
