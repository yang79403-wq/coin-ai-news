name: Daily Coin AI News Update

on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate daily content
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import json

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)
          date = now.strftime('%Y-%m-%d')
          stamp = now.strftime('%Y-%m-%d %H:%M')

          out = Path('data/daily-content.json')
          out.parent.mkdir(parents=True, exist_ok=True)

          payload = {
              'date': date,
              'updated_at': stamp,
              'title': f'{date} 钱币收藏资讯｜福建泉州·全国市场',
              'intro': '币智通 AI 每日资讯中心：自动整理钱币收藏知识、市场观察与公开成交信息研究。',
              'local_focus': '福建泉州',
              'services': ['免费鉴定', '免费评估', '收藏咨询', '行情研究'],
              'categories': ['老银元', '古钱币', '老纸币', '金币', '纪念币', '评级币'],
              'notice': '市场挂牌价不等于真实成交价，资讯与行情仅供收藏研究参考。'
          }
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')

      - name: Update homepage date marker
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re
          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html not found')
          s = p.read_text(encoding='utf-8')
          tz = timezone(timedelta(hours=8))
          stamp = datetime.now(tz).strftime('%Y-%m-%d %H:%M')
          marker = f'<!-- AI_DAILY_UPDATE:{stamp} -->'
          s = re.sub(r'<!-- AI_DAILY_UPDATE:.*? -->', '', s)
          s = s.replace('</body>', marker + '</body>')
          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name 'coin-ai-news-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/daily-content.json index.html
          git diff --cached --quiet || git commit -m "chore: daily AI coin news update"
          git push
